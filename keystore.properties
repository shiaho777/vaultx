# Release signing configuration for VaultX.
#
# The keystore (app/release.keystore) and its credentials are intentionally
# committed to the repository so that release builds are reproducible and the
# signing identity can be reused across machines/CI. This is a deliberate
# choice for this project — do NOT copy this pattern for apps where the
# signing key must remain private.
storeFile=release.keystore
storePassword=vaultx-release-2026
keyAlias=vaultx
keyPassword=vaultx-release-2026
