name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21: lazysodium 5.2.0 字节码为 Java 21(major 65),JDK 17 下原生路径
      # 无法类加载;源码兼容级仍是 17(build.gradle.kts),21 工具链向下兼容
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      # Release 构建验证 R8 混淆/资源收缩不破坏运行时。
      # 配置了签名 secrets 则产出签名包,否则 unsigned(仅验证构建)。
      - name: Assemble release APK
        env:
          VAULTX_STORE_FILE: ${{ github.workspace }}/ci-release.keystore
          VAULTX_STORE_PASSWORD: ${{ secrets.VAULTX_STORE_PASSWORD }}
          VAULTX_KEY_ALIAS: ${{ secrets.VAULTX_KEY_ALIAS }}
          VAULTX_KEY_PASSWORD: ${{ secrets.VAULTX_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.VAULTX_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.VAULTX_KEYSTORE_BASE64 }}" | base64 -d > ci-release.keystore
          else
            echo "No signing secrets configured; building unsigned release for R8 verification"
          fi
          ./gradlew :app:assembleRelease --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  # 仪器测试(含 LockClearsImageCacheTest 安全回归):KVM 加速模拟器
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (API 34 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain

      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/androidTests/